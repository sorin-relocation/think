<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>お見積もり内容の確認 | SŌRIN Relocation</title>
<style>
:root{color-scheme:light;--navy:#16343a;--teal:#2D898F;--gold:#d4af37;--line:#dce6e6}*{box-sizing:border-box}body{margin:0;background:#f4f7f7;color:#26383b;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.wrap{max-width:680px;margin:0 auto;padding:24px 15px 48px}.brand{text-align:center;color:var(--navy);font-weight:800;letter-spacing:.08em;font-size:20px;margin:8px 0 22px}.brand span{color:var(--gold)}h1{font-size:21px;margin:0 0 8px;color:var(--navy)}.intro{font-size:14px;line-height:1.8;color:#526568;margin:0 0 20px}.section{background:#fff;border:1px solid var(--line);border-radius:18px;margin:16px 0;overflow:hidden;box-shadow:0 5px 18px rgba(22,52,58,.045)}.section h2{font-size:15px;margin:0;padding:15px 17px;background:linear-gradient(100deg,#eaf4f3 0%,#f6f8f5 100%);color:var(--navy);border-left:4px solid var(--teal);letter-spacing:.03em}.row{display:grid;grid-template-columns:90px minmax(0,1fr);align-items:start;column-gap:16px;padding:15px 17px;border-top:1px solid #edf1f1;font-size:14px;line-height:1.7;overflow-wrap:anywhere}.row:first-of-type{border-top:0}.label{color:#657679;font-weight:700;white-space:nowrap;padding-top:1px}.breakdown-row .label{display:block}.value{min-width:0;white-space:pre-wrap}.value-lines{display:grid;gap:7px}.value-line{padding:0 0 7px;border-bottom:1px solid #edf1f1}.value-line:last-child{padding-bottom:0;border-bottom:0}.date-value{display:grid;gap:3px}.date-value .date{font-weight:700;color:#26383b}.date-value .time{color:#526568}.detail-lines{display:grid;grid-column:1 / -1;width:100%;min-width:0;gap:0;background:#f7f9f8;border-radius:12px;padding:5px 13px;white-space:normal;overflow-wrap:anywhere}
.detail-line{display:block;width:100%;min-width:0;padding:11px 0;border-bottom:1px solid #e5ecea;line-height:1.65;white-space:normal;overflow-wrap:anywhere}
.detail-line:last-child{border-bottom:0}.breakdown-row{display:grid;grid-template-columns:1fr;gap:9px}.breakdown-row .detail-lines{grid-column:1;width:100%}
.detail-name{display:block;color:#526568;font-size:13px;white-space:normal;overflow-wrap:anywhere}
.detail-amount{font-weight:700;color:#26383b;text-align:right;white-space:nowrap}
.detail-line.total-detail{background:#EAF5F4;margin:4px -8px;padding:12px 8px;border-radius:8px;border:0}
.price-row .value{font-size:21px;font-weight:800;color:#2D898F;letter-spacing:.01em;text-align:right}
.price-row{background:linear-gradient(100deg,#fffdf5,#fff)}
.price-row{grid-template-columns:minmax(0,1fr) auto;column-gap:14px;align-items:center}.price-row .label{color:#8b7225;text-align:right;justify-self:end}.price-row .value{justify-self:end;text-align:right}
.address-value{display:grid;gap:3px}
.address-value .address-main{font-weight:600}
.address-value .address-building{color:#64777a;font-size:13px}.status{text-align:center;padding:34px 12px;color:#637477}.footer{text-align:center;color:#879496;font-size:11px;margin-top:25px}
@media(max-width:420px){.row{grid-template-columns:82px minmax(0,1fr);column-gap:12px;padding:14px 13px}.label{font-size:13px}.value{font-size:14px}.price-row .value{font-size:20px;text-align:right}.price-row{grid-template-columns:minmax(0,1fr) auto;column-gap:10px}.price-row .label{font-size:13px}.detail-line{gap:7px}}

.row{display:grid;grid-template-columns:90px minmax(0,1fr);align-items:start;column-gap:14px;padding:15px 17px;border-top:1px solid #edf1f1;font-size:14px;line-height:1.7;overflow-wrap:anywhere}
.label{color:#657679;font-weight:700;white-space:nowrap;padding-top:1px}
.value{min-width:0;white-space:pre-wrap;overflow-wrap:anywhere}
.breakdown-row{display:block;padding:15px 17px}
.breakdown-label{margin:0 0 10px}
.detail-lines{display:block;width:100%;min-width:0;background:#f5f8f7;border-radius:12px;padding:12px 15px;white-space:normal;overflow-wrap:anywhere}
.detail-line{display:block;width:100%;padding:10px 0;border-bottom:1px solid #e1eae8;line-height:1.65;white-space:normal;overflow-wrap:anywhere}
.detail-line:last-child{border-bottom:0}
.address-value{display:grid;grid-template-columns:minmax(0,1fr);gap:3px}
.address-main{font-weight:600}
.address-building{color:#64777a;font-size:13px}
.price-row{background:linear-gradient(100deg,#fffdf5,#fff);grid-template-columns:90px minmax(0,1fr)}
.price-row{grid-template-columns:minmax(0,1fr) auto;column-gap:14px;align-items:center}.price-row .label{color:#8b7225;text-align:right;justify-self:end}.price-row .value{justify-self:end;text-align:right}
.price-row .value{font-size:21px;font-weight:800;color:#2D898F;letter-spacing:.01em;text-align:right}
@media(max-width:420px){
.row{grid-template-columns:82px minmax(0,1fr);column-gap:12px;padding:14px 13px}
.breakdown-row{display:block;padding:14px 13px}
.label{font-size:13px}
.value{font-size:14px}
.price-row{grid-template-columns:82px minmax(0,1fr)}
.price-row .value{font-size:20px;text-align:right}.price-row{grid-template-columns:minmax(0,1fr) auto;column-gap:10px}.price-row .label{font-size:13px}
}


/* 料金内訳：見積もりフォームの明細表に合わせた横幅いっぱいのレイアウト */
.breakdown-row{display:block;padding:15px 17px}
.breakdown-row .breakdown-label{margin:0 0 12px}
.breakdown-row .detail-lines{display:block;width:100%;min-width:0;padding:0;margin:0;background:transparent;border-radius:0;overflow:visible}
.breakdown-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px;line-height:1.6}
.breakdown-table th{padding:10px 8px;background:#EAF5F4;color:#37545a;text-align:left;font-weight:800}
.breakdown-table th:first-child{width:21%}
.breakdown-table th:last-child{width:23%;text-align:right}
.breakdown-table td{padding:12px 8px;border-bottom:1px solid #dce7e7;vertical-align:top;overflow-wrap:anywhere}
.breakdown-table td:first-child{color:#16343a;font-weight:700}
.breakdown-table td:nth-child(2){color:#607277}.distance-detail-line{display:block;margin:0 0 4px;white-space:normal}.distance-detail-line:last-child{margin-bottom:0}
.breakdown-table td:last-child{text-align:right;white-space:nowrap;color:#16343a;font-weight:800}
.breakdown-table .breakdown-total td{padding:16px 10px;background:#EAF5F4;border-bottom:0;color:#16343a;font-weight:800}
.breakdown-table .breakdown-total td:last-child{font-size:21px;color:#2D898F}
@media(max-width:420px){
 .breakdown-row{padding:14px 13px}
 .breakdown-table{font-size:12px}
 .breakdown-table th{padding:9px 5px}
 .breakdown-table th:first-child{width:20%}
 .breakdown-table th:last-child{width:23%}
 .breakdown-table td{padding:11px 5px}
 .breakdown-table .breakdown-total td:last-child{font-size:18px}
}


/* 住所：項目名・住所・建物情報を縦3段で全幅表示 */
.address-row{display:block;padding:15px 17px}
.address-row .label{display:block;margin:0 0 7px;padding:0}
.address-row .address-value{display:block;width:100%;min-width:0}
.address-row .address-main{display:block;font-weight:700;line-height:1.65;white-space:normal;overflow-wrap:anywhere;word-break:normal}
.address-row .address-building{display:block;margin-top:5px;color:#64777a;font-size:13px;line-height:1.5;white-space:normal;overflow-wrap:anywhere}
@media(max-width:420px){.address-row{padding:14px 13px}.address-row .label{font-size:13px}.address-row .address-main{font-size:14px}}


/* 住所・建物情報を項目名より約2文字分右へずらして段差を付ける */
.address-row .address-value{
  padding-left:2em;
  box-sizing:border-box;
}

</style></head><body><main class="wrap"><div class="brand">SŌRIN <span>Relocation</span></div><h1>お見積もり内容の確認</h1><p class="intro">入力いただいたお見積もり・ご相談内容をご確認いただけます。ご希望日時は確定ではありません。</p><div id="content" class="status">内容を読み込んでいます…</div><div class="footer">SŌRIN Relocation</div></main>
<script>
(async()=>{const root=document.getElementById('content');function getTokenFromLiffUrl(){
  const params=new URLSearchParams(location.search);
  let token=params.get('t')||'';
  if(token)return token;
  // LIFFはEndpoint URLへ遷移する際、元URLのクエリをliff.stateへ格納する場合がある。
  const state=params.get('liff.state')||params.get('liffState')||'';
  if(state){
    try{
      const stateUrl=new URL(state,location.origin);
      token=stateUrl.searchParams.get('t')||'';
      if(token)return token;
    }catch(_){
      const nested=new URLSearchParams(state.replace(/^\?/,'').replace(/^\//,''));
      token=nested.get('t')||'';
      if(token)return token;
    }
  }
  // LIFFの状態がhash側に渡されたケースも許容する。
  const hash=location.hash||'';
  const hashQuery=hash.includes('?')?hash.slice(hash.indexOf('?')+1):hash.replace(/^#/,'');
  return new URLSearchParams(hashQuery).get('t')||'';
}

const token=getTokenFromLiffUrl();if(!/^[0-9a-f-]{36}$/i.test(token)){root.textContent='確認ページのURLが正しくありません。LINEに届いたリンクから開き直してください。';return;}try{const r=await fetch('https://raelrzegewoftknalsws.supabase.co/functions/v1/line-estimate-notify?t='+encodeURIComponent(token),{headers:{'apikey':'sb_publishable_2Hzm21bczQC7uhCtrGHn1Q_8OhA_K9o'}});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'内容を確認できませんでした。');const s=d.snapshot||{};root.className='';root.replaceChildren();for(const sec of (s.sections||[])){const box=document.createElement('section');box.className='section';const h=document.createElement('h2');h.textContent=sec.title||'';box.append(h);for(const item of (sec.rows||[])){
        if(!item.value)continue;
        const row=document.createElement('div');
        row.className='row';
        const label=document.createElement('div');
        label.className='label';
        label.textContent=item.label||'';
        const value=document.createElement('div');
        value.className='value';
        const raw=String(item.value||'').trim();

        if(item.label==='見積金額'){
          row.classList.add('price-row');
          value.textContent=raw;
        }else if(item.label==='料金内訳'){
          row.classList.add('breakdown-row');
          label.classList.add('breakdown-label');
          value.className='detail-lines';
          let lines=raw.split(/\r?\n+/).map(x=>x.trim()).filter(Boolean);
          if(lines.length>1 && lines.length%2===0){
            const half=lines.length/2;
            if(lines.slice(0,half).join('|')===lines.slice(half).join('|')) lines=lines.slice(0,half);
          }
          const groups=[];
          const categoryPattern=/^(基本料金|荷物料金|階段料金|距離料金|出張費|調整額|作業料金|オプション料金|割増料金|その他料金)[：:]/;
          for(const entry of lines){
            if(categoryPattern.test(entry)||!groups.length) groups.push([entry]);
            else groups[groups.length-1].push(entry);
          }
          const table=document.createElement('table');
          table.className='breakdown-table';
          const thead=document.createElement('thead');
          const headRow=document.createElement('tr');
          for(const title of ['項目','内容','金額']){
            const th=document.createElement('th');th.textContent=title;headRow.append(th);
          }
          thead.append(headRow);table.append(thead);
          const tbody=document.createElement('tbody');
          for(const group of groups){
            const first=group[0];
            const firstMatch=first.match(/^([^：:]+)[：:]\s*(.*)$/);
            const category=firstMatch?firstMatch[1].trim():'その他';
            const contentParts=[firstMatch?firstMatch[2].trim():first];
            let amount='';
            for(let i=1;i<group.length;i++) contentParts.push(group[i]);
            for(let i=contentParts.length-1;i>=0;i--){
              const amountMatch=contentParts[i].match(/(?:[：:]\s*)(-?[\d,]+円)\s*$/);
              if(amountMatch){amount=amountMatch[1];contentParts[i]=contentParts[i].slice(0,amountMatch.index).trim();break;}
            }
            const tr=document.createElement('tr');
            const nameCell=document.createElement('td');nameCell.textContent=category;
            const contentCell=document.createElement('td');
            if(category==='距離料金'){
              const distanceLines=contentParts.filter(Boolean);
              for(const textLine of distanceLines){
                const line=document.createElement('div');
                line.className='distance-detail-line';
                line.textContent=textLine;
                contentCell.append(line);
              }
            }else{
              contentCell.textContent=contentParts.filter(Boolean).join('\n');
            }
            const amountCell=document.createElement('td');amountCell.textContent=amount;
            tr.append(nameCell,contentCell,amountCell);tbody.append(tr);
          }
          table.append(tbody);value.append(table);
        }else if(/^(搬出元|搬入先|住所|立寄所\d+)$/.test(item.label||'')){
          value.className='value address-value';
          const m=raw.match(/^(.*\d+(?:-\d+)*?)\s+(戸建|市営\s*\S+|県営\s*\S+|マンション.*|アパート.*|ハイツ.*|コーポ.*)$/);
          if(m){
            row.classList.add('address-row');
            const main=document.createElement('div');
            main.className='address-main';
            main.textContent=m[1];
            const building=document.createElement('div');
            building.className='address-building';
            building.textContent=m[2];
            value.append(main,building);
          }else{
            row.classList.add('address-row');
            value.classList.add('address-main');
            value.textContent=raw;
          }
        }else if(sec.title==='希望日時' && /^第\d+希望$/.test(item.label||'')){
          const m=raw.match(/^(\d{4}[-/]\d{1,2}[-/]\d{1,2})\s+(.+)$/);
          if(m){
            value.className+=' date-value';
            const date=document.createElement('div');
            date.className='date';
            date.textContent=m[1];
            const time=document.createElement('div');
            time.className='time';
            time.textContent=m[2];
            value.append(date,time);
          }else value.textContent=raw;
        }else if(item.label==='荷物'){
          const entries=raw.split(/[、,，]\s*/).map(x=>x.replace(/\s*（お客様対応）/g,'').trim()).filter(Boolean);
          value.className+=' value-lines';
          for(const entry of entries){
            const line=document.createElement('div');
            line.className='value-line';
            line.textContent=entry;
            value.append(line);
          }
        }else{
          value.textContent=raw;
        }

        row.append(label,value);
        box.append(row);
      }root.append(box);}if(!root.children.length)root.textContent='表示できる内容がありません。SŌRINまでお問い合わせください。';}catch(e){root.textContent=e.message||'内容を読み込めませんでした。時間をおいて再度お試しください。';}})();
</script></body></html>
