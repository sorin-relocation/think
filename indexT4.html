<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>お見積もり内容の確認 | SŌRIN Relocation</title>
<style>
:root{color-scheme:light;--navy:#16343a;--teal:#168b8b;--gold:#d4af37;--line:#dce6e6}*{box-sizing:border-box}body{margin:0;background:#f4f7f7;color:#26383b;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.wrap{max-width:680px;margin:0 auto;padding:24px 15px 48px}.brand{text-align:center;color:var(--navy);font-weight:800;letter-spacing:.08em;font-size:20px;margin:8px 0 22px}.brand span{color:var(--gold)}h1{font-size:21px;margin:0 0 8px;color:var(--navy)}.intro{font-size:14px;line-height:1.8;color:#526568;margin:0 0 20px}.section{background:#fff;border:1px solid var(--line);border-radius:18px;margin:16px 0;overflow:hidden;box-shadow:0 5px 18px rgba(22,52,58,.045)}.section h2{font-size:15px;margin:0;padding:15px 17px;background:linear-gradient(100deg,#eaf4f3 0%,#f6f8f5 100%);color:var(--navy);border-left:4px solid var(--teal);letter-spacing:.03em}.row{display:grid;grid-template-columns:92px minmax(0,1fr);align-items:start;column-gap:22px;padding:15px 17px;border-top:1px solid #edf1f1;font-size:14px;line-height:1.7;overflow-wrap:anywhere}.row:first-of-type{border-top:0}.label{color:#657679;font-weight:700;white-space:nowrap;padding-top:1px}.value{min-width:0;white-space:pre-wrap}.value-lines{display:grid;gap:7px}.value-line{padding:0 0 7px;border-bottom:1px solid #edf1f1}.value-line:last-child{padding-bottom:0;border-bottom:0}.date-value{display:grid;gap:3px}.date-value .date{font-weight:700;color:#26383b}.date-value .time{color:#526568}.detail-lines{display:grid;gap:0;background:#f7f9f8;border-radius:12px;padding:5px 13px}
.detail-line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid #e5ecea;line-height:1.55}
.detail-line:last-child{border-bottom:0}
.detail-name{color:#526568;font-size:13px}
.detail-amount{font-weight:700;color:#26383b;text-align:right;white-space:nowrap}
.detail-line.total-detail{background:#eaf4f2;margin:4px -8px;padding:12px 8px;border-radius:8px;border:0}
.price-row .value{font-size:21px;font-weight:800;color:#087f78;letter-spacing:.01em}
.price-row{background:linear-gradient(100deg,#fffdf5,#fff)}
.price-row .label{color:#8b7225}
.address-value{display:grid;gap:3px}
.address-value .address-main{font-weight:600}
.address-value .address-building{color:#64777a;font-size:13px}.status{text-align:center;padding:34px 12px;color:#637477}.footer{text-align:center;color:#879496;font-size:11px;margin-top:25px}
@media(max-width:420px){.row{grid-template-columns:82px minmax(0,1fr);column-gap:17px;padding:14px 13px}.label{font-size:13px}.value{font-size:14px}.price-row .value{font-size:20px}.detail-line{gap:7px}}
</style></head><body><main class="wrap"><div class="brand">SŌRIN <span>Relocation</span></div><h1>お見積もり内容の確認</h1><p class="intro">お送りしたお見積もり・ご相談内容をご確認いただけます。ご希望日時は確定ではありません。内容確認後、担当者より改めてご連絡いたします。</p><div id="content" class="status">内容を読み込んでいます…</div><div class="footer">SŌRIN Relocation</div></main>
<script>
(async()=>{const root=document.getElementById('content');function getTokenFromLiffUrl(){
  const params=new URLSearchParams(location.search);
  let token=params.get('t')||'';
  if(token)return token;
  // LIFFはEndpoint URLへ遷移する際、元URLのクエリをliff.stateへ格納する場合がある。
  const state=params.get('liff.state')||params.get('liffState')||'';
  if(state){
    try{
      const stateUrl=new URL(state,location.origin);
      token=stateUrl.searchParams.get('t')||'';
      if(token)return token;
    }catch(_){
      const nested=new URLSearchParams(state.replace(/^\?/,'').replace(/^\//,''));
      token=nested.get('t')||'';
      if(token)return token;
    }
  }
  // LIFFの状態がhash側に渡されたケースも許容する。
  const hash=location.hash||'';
  const hashQuery=hash.includes('?')?hash.slice(hash.indexOf('?')+1):hash.replace(/^#/,'');
  return new URLSearchParams(hashQuery).get('t')||'';
}

const token=getTokenFromLiffUrl();if(!/^[0-9a-f-]{36}$/i.test(token)){root.textContent='確認ページのURLが正しくありません。LINEに届いたリンクから開き直してください。';return;}try{const r=await fetch('https://raelrzegewoftknalsws.supabase.co/functions/v1/line-estimate-notify?t='+encodeURIComponent(token),{headers:{'apikey':'sb_publishable_2Hzm21bczQC7uhCtrGHn1Q_8OhA_K9o'}});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'内容を確認できませんでした。');const s=d.snapshot||{};root.className='';root.replaceChildren();for(const sec of (s.sections||[])){const box=document.createElement('section');box.className='section';const h=document.createElement('h2');h.textContent=sec.title||'';box.append(h);for(const item of (sec.rows||[])){if(!item.value)continue;const row=document.createElement('div');row.className='row';const label=document.createElement('div');label.className='label';label.textContent=item.label||'';const value=document.createElement('div');value.className='value';if(item.label==='見積金額')row.classList.add('price-row');
        const raw=String(item.value||'').trim();
        const isAddressLabel=/^(搬出元|搬入先|住所|立寄所\\d+)$/.test(item.label||'');
        if(sec.title==='希望日時' && /^第\d+希望$/.test(item.label||'')){
          const m=raw.match(/^(\d{4}[-/]\d{1,2}[-/]\d{1,2})\s+(.+)$/);
          if(m){
            value.className+=' date-value';
            const date=document.createElement('div');date.className='date';date.textContent=m[1];
            const time=document.createElement('div');time.className='time';time.textContent=m[2];
            value.append(date,time);
          }else value.textContent=raw;
        }else if(item.label==='荷物'){
          const entries=raw.split(/[、,，]\s*/).map(x=>x.replace(/\s*（お客様対応）/g,'').trim()).filter(Boolean);
          value.className+=' value-lines';
          for(const entry of entries){const line=document.createElement('div');line.className='value-line';line.textContent=entry;value.append(line);}
        }else if(item.label==='料金内訳'){
          let lines=raw.split(/\n+/).map(x=>x.trim()).filter(Boolean);
          if(lines.length%2===0){
            const half=lines.length/2;
            if(lines.slice(0,half).join('¦')===lines.slice(half).join('¦'))lines=lines.slice(0,half);
          }
          value.className+=' detail-lines';
          for(const entry of lines){
            const line=document.createElement('div');line.className='detail-line';
            const pos=entry.indexOf('：');
            const name=document.createElement('span');name.className='detail-name';
            const amount=document.createElement('span');amount.className='detail-amount';
            if(pos>0){name.textContent=entry.slice(0,pos).trim();amount.textContent=entry.slice(pos+1).trim();}
            else{name.textContent=entry;amount.textContent='';}
            line.append(name,amount);value.append(line);
          }
        }else value.textContent=raw;
        row.append(label,value);box.append(row);}root.append(box);}if(!root.children.length)root.textContent='表示できる内容がありません。SŌRINまでお問い合わせください。';}catch(e){root.textContent=e.message||'内容を読み込めませんでした。時間をおいて再度お試しください。';}})();
</script></body></html>
